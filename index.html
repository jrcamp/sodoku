<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ec">
  <meta name="description" content="Sudoku, online or offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <script>
    try {
      const theme = localStorage.getItem('sudoku-theme');
      if (['forest', 'blue', 'lavender', 'cobalt', 'amber', 'plum'].includes(theme)) document.documentElement.dataset.theme = theme;
    } catch { /* Use the default when storage is unavailable. */ }
    try {
      const d = JSON.parse(localStorage.getItem('sudoku-display')) || {};
      const clamp = (v, lo, hi, def) => Number.isFinite(+v) && v !== null ? Math.min(hi, Math.max(lo, +v)) : def;
      const root = document.documentElement.style;
      root.setProperty('--number-scale', clamp(d.numberSize, 70, 140, 100) / 100);
      root.setProperty('--cell-line-width', clamp(d.cellLine, 1, 4, 1) + 'px');
      root.setProperty('--box-line-width', clamp(d.boxLine, 2, 8, 3) + 'px');
    } catch { /* Use default sizes when storage is unavailable. */ }
    try { if (localStorage.getItem('sudoku-cat') !== 'off') document.documentElement.classList.add('cat-on'); }
    catch { document.documentElement.classList.add('cat-on'); }
  </script>
  <link rel="stylesheet" href="./styles.css">
  <title>Sudoku</title>
</head>
<body>
  <div class="app-shell">
    <header class="masthead">
      <a class="brand" href="./" aria-label="Sudoku home"><span class="brand-icon" aria-hidden="true">▦</span> sudoku<span class="brand-dot">.</span></a>
      <div class="header-actions">
        
        <button class="settings-button" id="open-settings" aria-haspopup="dialog"><span aria-hidden="true">⚙</span> Settings</button>
      </div>
    </header>
    <main>
      <section class="game-area" aria-label="Sudoku puzzle">
        <div id="cat-lane" class="cat-lane" aria-hidden="true" hidden></div>
        <div id="board" class="board" role="group" aria-label="Sudoku board"></div>
        <div id="celebration" class="celebration" role="status" hidden>
          <div class="celebration-card">
            <p class="celebration-mark" aria-hidden="true">✦</p>
            <h2>Solved!</h2>
            <p id="celebration-detail"></p>
            <div class="celebration-actions"><button id="celebration-close">Admire it</button><button class="dialog-primary" id="celebration-new">New puzzle</button></div>
          </div>
        </div>
      </section>
      <aside class="controls" aria-label="Game controls">
        <div class="difficulty-control"><label for="difficulty">Difficulty</label><select id="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div>
        <div class="number-pad" id="number-pad" role="group" aria-label="Choose a number"></div>
        <div class="edit-controls"><button id="undo" disabled><span aria-hidden="true">↶</span> Undo</button><button id="erase" aria-pressed="false"><span aria-hidden="true">⌫</span> Erase</button></div>
        <p id="save-state" class="save-warning" role="status"></p>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <button class="new-game" id="new-game">New puzzle <span aria-hidden="true">↗</span></button>
      </aside>
    </main>
  </div>
  <dialog id="new-dialog"><h2>New puzzle?</h2><p>This replaces your current puzzle.</p><label for="new-difficulty">Difficulty</label><select id="new-difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select><div class="dialog-actions"><button id="cancel-new">Cancel</button><button class="dialog-primary" id="confirm-new">New puzzle</button></div></dialog>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <h2 id="settings-title">Display</h2>
    <div class="setting setting-theme"><label for="theme">Theme</label><select id="theme"><option value="forest">Forest</option><option value="blue">Bright blue</option><option value="lavender">Lavender</option><option value="cobalt">Bold cobalt</option><option value="amber">Amber ink</option><option value="plum">Deep plum</option></select></div>
    <div class="setting setting-toggle"><label for="cat-toggle">Cat companion <span class="setting-note">Pip lives on top of the board</span></label><input type="checkbox" id="cat-toggle" role="switch"></div>
    <div class="setting"><label for="number-size">Number size</label><output id="number-size-value" for="number-size"></output><input type="range" id="number-size" min="70" max="140" step="5"></div>
    <div class="setting"><label for="cell-line">Cell lines</label><output id="cell-line-value" for="cell-line"></output><input type="range" id="cell-line" min="1" max="4" step="0.5"></div>
    <div class="setting"><label for="box-line">Box lines</label><output id="box-line-value" for="box-line"></output><input type="range" id="box-line" min="2" max="8" step="1"></div>
    <div class="dialog-actions"><button id="reset-settings">Reset</button><button class="dialog-primary" id="close-settings">Done</button></div>
  </dialog>
  <dialog id="debug-dialog" class="settings-dialog debug-dialog" aria-labelledby="debug-title">
    <h2 id="debug-title">Debug</h2>
    <p>Testing shortcuts. Moves can be undone.</p>
    <div class="debug-actions">
      <button data-debug="all-but-one">Solve all but one square</button>
      <button data-debug="solve">Solve puzzle</button>
      <button data-debug="number">Finish selected number</button>
      <button data-debug="some">Fill 10 random squares</button>
      <button data-debug="reset">Clear my entries</button>
      <div class="debug-row"><button data-debug="cat-nap">Cat: nap</button><button data-debug="cat-yarn">Cat: yarn</button><button data-debug="cat-butterfly">Cat: butterfly</button><button data-debug="cat-groom">Cat: groom</button></div>
    </div>
    <div class="dialog-actions"><button class="dialog-primary" id="close-debug">Done</button></div>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
